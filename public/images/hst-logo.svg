<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <circle cx="200" cy="200" r="180" fill="url(#hst-gradient)"/>
  
  <!-- Subtle pattern/texture -->
  <circle cx="200" cy="200" r="180" fill="url(#noise)" opacity="0.1"/>
  
  <!-- Main HST text -->
  <text x="200" y="240" font-family="'Arial Black', sans-serif" font-size="120" font-weight="900" fill="white" text-anchor="middle" letter-spacing="-2">HST</text>
  
  <!-- Microphone icon subtle hint -->
  <circle cx="200" cy="100" r="20" fill="white" opacity="0.3"/>
  <rect x="195" y="115" width="10" height="25" fill="white" opacity="0.3" rx="2"/>
  
  <!-- Definitions -->
  <defs>
    <!-- Main gradient -->
    <linearGradient id="hst-gradient" x1="0" y1="0" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    
    <!-- Noise pattern -->
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" />
    </filter>
  </defs>
</svg>
